<!doctype html>
<html lang="zh-CN" data-luogu-login>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>进入洛谷学习站 · Colorful Seika</title>
  <link rel="stylesheet" href="login.css">
  <script src="luogu-gate-config.js"></script>
</head>
<body>
  <main class="gate-card">
    <div class="gate-icon" aria-hidden="true">🔐</div>
    <p class="gate-kicker">KOTORI'S STUDY SPACE</p>
    <h1>进入洛谷学习站</h1>
    <p>请输入原访问密码。验证通过后会回到你刚才打开的页面。</p>
    <form id="gate-form">
      <input id="gate-password" aria-label="访问密码" type="password" autocomplete="current-password" placeholder="访问密码" required autofocus>
      <button type="submit">确认进入</button>
    </form>
    <p id="gate-message" class="gate-message" role="status"></p>
    <a href="./">← 返回学习站</a>
  </main>
  <script src="login.js"></script>
</body>
</html>

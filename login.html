<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>进入 Colorful Seika</title>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#fff4f8,#edf6f2);color:#493f51;font-family:system-ui,"Noto Sans SC",sans-serif}.gate-card{width:min(400px,100%);padding:36px;background:#fffdf9;border:1px solid #eadde2;box-shadow:0 24px 70px #74586b24}.gate-icon{font-size:38px}.gate-kicker{margin:12px 0 0;color:#ad5575;font-size:11px;letter-spacing:.14em}.gate-card h1{margin:8px 0;color:#527d70}.gate-card p{color:#766f7c;line-height:1.7}.gate-card input,.gate-card button{width:100%;min-height:48px;font:inherit}.gate-card input{margin:10px 0;padding:0 14px;border:1px solid #d9ccd2;background:white}.gate-card button{border:0;background:#527d70;color:white;cursor:pointer}.gate-card button:disabled{opacity:.55}.gate-message{min-height:24px;margin:10px 0 0!important;color:#a94467!important;font-size:13px}
  </style>
  <script src="gate-config.js"></script>
</head>
<body>
  <main class="gate-card">
    <div class="gate-icon">🔐</div>
    <p class="gate-kicker">KOTORI'S STUDY SPACE</p>
    <h1>进入 Colorful Seika</h1>
    <p>请输入访问密码。验证通过后，本浏览器将保持登录 7 天。</p>
    <form id="gate-form">
      <input id="gate-password" type="password" autocomplete="current-password" placeholder="Password" required autofocus>
      <button type="submit">确认进入</button>
    </form>
    <p id="gate-message" class="gate-message" role="status"></p>
  </main>
  <script src="login.js"></script>
</body>
</html>

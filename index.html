<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="gate-config.js"></script>
    <script src="gate.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotori's Colorful Seika</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="bg-layer"></div>
    <div id="particles"></div>

    <div id="app">
        <header id="header">
            <div class="header-left">
                <h1 class="site-title">Kotori's Colorful Seika</h1>
                <p class="subtitle">Learning is a colorful journey</p>
            </div>
            <div class="header-right">
                <a href="https://bangumi.tv/user/1151382" class="header-btn" target="_blank" title="Bangumi">
                    <span class="btn-icon">📺</span> Bangumi
                </a>
                <a href="code-analysis/" class="header-btn code-analysis-btn" title="Code Analysis">
                    <span class="btn-icon">🔮</span> Code Analysis
                </a>
                <a id="obsidian-link" class="header-btn" title="Obsidian笔记">
                    <span class="btn-icon">📒</span> Obsidian
                </a>
                <button id="settings-btn" class="header-btn" title="设置">
                    <span class="btn-icon">⚙️</span> 设置
                </button>
                <button id="bg-view-btn" class="header-btn" title="观赏背景">
                    <span class="btn-icon">🖼️</span> 观赏
                </button>
                <button class="header-btn" type="button" title="退出登录" onclick="SpaceGate.logout()">
                    <span class="btn-icon">🔒</span> 退出
                </button>
            </div>
        </header>

        <div class="main-layout">
            <aside id="sidebar">
                <div class="sidebar-section">
                    <h3>📚 学科领域</h3>
                    <div id="subject-nav" class="subject-nav">
                        <div class="subject-group">
                            <div class="subject-group-header">📐 数学</div>
                            <button class="subject-btn sub active" data-subject="math-probability"><span class="subj-icon">🎲</span> 概率论</button>
                            <button class="subject-btn sub" data-subject="math-ode"><span class="subj-icon">〰️</span> 常微分方程</button>
                        </div>
                        <div class="subject-group">
                            <div class="subject-group-header">⚛️ 物理</div>
                            <button class="subject-btn sub" data-subject="physics-mech"><span class="subj-icon">⚙️</span> 理力</button>
                            <button class="subject-btn sub" data-subject="physics-general"><span class="subj-icon">🧲</span> 普物</button>
                        </div>
                        <div class="subject-group">
                            <div class="subject-group-header">💻 计算机</div>
                            <button class="subject-btn sub" data-subject="cs-ics"><span class="subj-icon">🖥️</span> ICS</button>
                            <button class="subject-btn sub" data-subject="cs-dsa"><span class="subj-icon">🧮</span> 数算</button>
                        </div>
                        <button class="subject-btn" data-subject="research"><span class="subj-icon">🔬</span> 科研</button>
                        <a class="subject-btn subject-link" href="algorithm/"><span class="subj-icon">🏆</span> 算法 ↗</a>
                        <a class="subject-btn subject-link code-analysis-link" href="code-analysis/"><span class="subj-icon">🔮</span> Code Analysis ↗</a>
                        <a id="public-recite-link" class="subject-btn subject-link" href="https://kotori-cjk.github.io/recite/"><span class="subj-icon">📕</span> 课程背诵 ↗</a>
                        <a class="subject-btn subject-link" href="ai-recite/"><span class="subj-icon">🧠</span> AI 背诵 ↗</a>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>📋 今日待办</h3>
                    <div id="task-summary" class="task-summary">
                        <span id="task-count">0 项待办</span>
                    </div>
                    <button class="subject-btn task-nav-btn" data-subject="tasks"><span class="subj-icon">✅</span> 任务面板</button>
                </div>

                <div class="sidebar-section music-section">
                    <h3>🎵 音乐</h3>
                    <div id="music-container">
                        <p class="empty-hint">在设置中添加网易云音乐~</p>
                    </div>
                </div>
                <div class="save-indicator" id="save-indicator">💾 就绪</div>
            </aside>

            <main id="main-content">
                <!-- Subject header with links -->
                <div id="subject-header" class="subject-header"></div>

                <!-- Tab area: notes view -->
                <div id="view-notes" class="view-content active"></div>

                <!-- Task view (shown when "tasks" is selected) -->
                <div id="view-tasks" class="view-content"></div>
            </main>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ 设置</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-group">
                    <h3>📒 Obsidian</h3>
                    <label>Vault 名称</label>
                    <input type="text" id="set-obsidian-vault" placeholder="Obsidian Vault">
                    <label>🎲 概率论 笔记文件夹</label>
                    <input type="text" id="set-obs-math-probability" placeholder="例：概率论">
                    <label>〰️ 常微分方程 笔记文件夹</label>
                    <input type="text" id="set-obs-math-ode" placeholder="例：常微分方程">
                    <label>⚙️ 理力 笔记文件夹</label>
                    <input type="text" id="set-obs-physics-mech" placeholder="例：理力">
                    <label>🧲 普物 笔记文件夹</label>
                    <input type="text" id="set-obs-physics-general" placeholder="例：普物">
                    <label>🖥️ ICS 笔记文件夹</label>
                    <input type="text" id="set-obs-cs-ics" placeholder="例：ICS">
                    <label>🧮 数算 笔记文件夹</label>
                    <input type="text" id="set-obs-cs-dsa" placeholder="例：数算">
                    <label>🔬 科研 笔记文件夹</label>
                    <input type="text" id="set-obs-research" placeholder="例：科研">
                </div>
                <div class="settings-group">
                    <h3>🔗 NotebookLM 链接</h3>
                    <label>🎲 概率论</label>
                    <input type="text" id="set-nlm-math-probability" placeholder="NotebookLM URL">
                    <label>〰️ 常微分方程</label>
                    <input type="text" id="set-nlm-math-ode" placeholder="NotebookLM URL">
                    <label>⚙️ 理力</label>
                    <input type="text" id="set-nlm-physics-mech" placeholder="NotebookLM URL">
                    <label>🧲 普物</label>
                    <input type="text" id="set-nlm-physics-general" placeholder="NotebookLM URL">
                    <label>🖥️ ICS</label>
                    <input type="text" id="set-nlm-cs-ics" placeholder="NotebookLM URL">
                    <label>🧮 数算</label>
                    <input type="text" id="set-nlm-cs-dsa" placeholder="NotebookLM URL">
                    <label>🔬 科研</label>
                    <input type="text" id="set-nlm-research" placeholder="NotebookLM URL">
                </div>
                <div class="settings-group">
                    <h3>🎨 背景图片</h3>
                    <div class="bg-upload-area">
                        <input type="file" id="bg-upload" accept="image/*" multiple hidden>
                        <button class="btn btn-accent" onclick="document.getElementById('bg-upload').click()">📷 上传图片</button>
                        <span class="upload-hint">支持多张切换</span>
                    </div>
                    <div id="bg-preview-list" class="bg-preview-list"></div>
                    <button id="bg-reset-btn" class="btn btn-secondary">恢复默认背景</button>
                </div>
                <div class="settings-group">
                    <h3>🎵 网易云音乐</h3>
                    <div class="music-add-row">
                        <input type="text" id="music-input" placeholder="粘贴歌曲链接或ID">
                        <button id="music-add-btn" class="btn btn-primary">添加</button>
                    </div>
                    <div id="music-manage-list" class="music-manage-list"></div>
                </div>
                <div class="settings-group">
                    <h3>💾 数据管理</h3>
                    <div class="data-actions">
                        <button id="export-btn" class="btn btn-secondary">📤 导出数据</button>
                        <button class="btn btn-secondary" onclick="document.getElementById('import-file').click()">📥 导入数据</button>
                        <input type="file" id="import-file" accept=".json" hidden>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="seed.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <button class="bg-view-exit" id="bg-view-exit">🖼️ 点击或按 Esc 退出观赏</button>
    <div class="save-toast" id="save-toast"></div>
    <script src="app.js"></script>
    <script type="module">
        import { SITE_CONFIG } from './site-config.js';
        document.getElementById('public-recite-link').href = SITE_CONFIG.reciteUrl;
    </script>
</body>
</html>

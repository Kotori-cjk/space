        function blankPracticeState() {
            return { status: 'setup', subjectId: null, scope: 'current', questions: [], currentIndex: 0, showAnswer: false, answeredCount: 0, round: 1 };

        function storageKey(subjectId) {
            return 'red_engine_mistakes_' + subjectId;

        function loadMistakes() {
            subjectOrder.forEach(function(subjectId) {
                const saved = localStorage.getItem(storageKey(subjectId));
                mistakeSets[subjectId] = new Set(saved ? JSON.parse(saved) : []);
            });
            migrateLegacyXigaiMistakes();
        }

        function migrateLegacyXigaiMistakes() {
            const legacy = localStorage.getItem('xigai_mistakes');
            if (!SUBJECTS.xigai || !legacy || !mistakeSets.xigai || mistakeSets.xigai.size > 0) return;
            try {
                const legacyQuestions = new Set(JSON.parse(legacy));
                Object.keys(SUBJECTS.xigai.chapters).forEach(function(chapterKey) {
                    SUBJECTS.xigai.chapters[chapterKey].forEach(function(item) {
                        if (legacyQuestions.has(item.q)) mistakeSets.xigai.add(questionId('xigai', chapterKey, item));
                    });
                });
                saveMistakes('xigai');
            } catch (err) {
                console.warn('旧错题本迁移失败:', err);
            }

        function saveMistakes(subjectId) {
            localStorage.setItem(storageKey(subjectId), JSON.stringify(Array.from(mistakeSets[subjectId] || [])));
        }

        function getMistakeSet(subjectId) {
            if (!mistakeSets[subjectId]) mistakeSets[subjectId] = new Set();
            return mistakeSets[subjectId];
        }

        function questionId(subjectId, chapterKey, item) {
            return subjectId + '::' + chapterKey + '::' + item.q;
        }

        function enrichQuestion(subjectId, chapterKey, item, index) {
            return { id: questionId(subjectId, chapterKey, item), subjectId: subjectId, chapterKey: chapterKey, chapterName: chapterKey, q: item.q, a: item.a, index: index };
        }

        function questionsForChapters(subjectId, chapters) {
            let list = [];
            chapters.forEach(function(chapterKey) {
                const raw = SUBJECTS[subjectId].chapters[chapterKey] || [];
                raw.forEach(function(item, index) {
                    list.push(enrichQuestion(subjectId, chapterKey, item, index));
                });
            });
            return list;
        }

        function allQuestions(subjectId) {
            return questionsForChapters(subjectId, Object.keys(SUBJECTS[subjectId].chapters));

            return allQuestions(subjectId).filter(function(item) { return set.has(item.id); });
        }

        function escapeHtml(value) {

            });
            container.innerHTML = '<div class="max-w-xl mx-auto h-full flex flex-col justify-center">' +
                '<div class="text-center mb-8"><div class="text-6xl mb-4">♾️</div><h2 class="text-2xl font-bold text-gray-800">无限刷题</h2><p class="text-gray-500 text-sm mt-2">选择刷题范围后开始，题目会无限循环。</p></div>' +
                '<div class="space-y-3">' + scopeHtml + '</div>' +
                '<button onclick="startPractice()" class="mt-6 w-full bg-red-800 text-white py-4 rounded-lg font-bold hover:bg-red-700 shadow-md transition">开始刷题</button>' +
            '</div>';
        }

        window.setPracticeScope = function(scope) {
            practiceState.scope = scope;
            renderContent();
        };

        window.startPractice = function() {
            const pool = practicePool(practiceState.scope);
            if (pool.length === 0) { alert('当前范围没有题目。'); return; }
            practiceState = { status: 'active', subjectId: currentSubjectId, scope: practiceState.scope, questions: shuffleCopy(pool), currentIndex: 0, showAnswer: false, answeredCount: 0, round: 1 };
            renderContent();
        };

        function renderPracticeCard(container) {
            const q = practiceState.questions[practiceState.currentIndex];
            container.innerHTML = '<div class="max-w-3xl mx-auto flex flex-col h-full">' +
                '<div class="flex justify-between items-center mb-4 shrink-0 gap-3">' +
                    '<div class="text-xs font-bold text-gray-500 tracking-wider">♾️ 无限刷题 <span class="ml-2 bg-gray-200 px-2 py-0.5 rounded text-gray-700">已刷 ' + (practiceState.answeredCount + 1) + ' 题 · 第 ' + practiceState.round + ' 轮</span></div>' +
                    '<div class="flex gap-2">' + renderMistakeButton(q.id) + '<button onclick="resetPractice()" class="text-gray-400 hover:text-red-600 px-2 text-xl" title="退出">×</button></div>' +
                '</div>' +
                '<div class="w-full bg-gray-200 h-1.5 rounded-full mb-6 shrink-0 overflow-hidden"><div class="bg-red-800 h-1.5 rounded-full w-full"></div></div>' +
                '<div class="flex-1 bg-white rounded-xl shadow-sm border border-gray-100 p-6 md:p-10 overflow-y-auto flex flex-col relative">' +
                    '<div class="mb-8"><div class="text-xs text-gray-400 mb-2">' + escapeHtml(q.chapterName) + '</div><h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-snug">' + escapeHtml(q.q) + '</h3></div>' +
                    '<div class="' + (practiceState.showAnswer ? 'block fade-enter' : 'hidden') + ' flex-1 border-t border-dashed border-gray-200 pt-6"><div class="text-gray-400 text-xs uppercase font-bold mb-2">Answer</div><div class="text-gray-700 leading-relaxed text-lg">' + answerHtml(q.a) + '</div></div>' +
                    '<div class="' + (!practiceState.showAnswer ? 'flex' : 'hidden') + ' flex-1 items-center justify-center text-gray-300 flex-col py-10"><span class="text-4xl mb-2">🙈</span><span class="text-sm">先回忆，再查看答案</span></div>' +
                '</div>' +
                '<div class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-3 shrink-0">' +
                    '<button onclick="togglePracticeAnswer()" class="py-3 rounded-lg font-bold text-white shadow-md transition ' + (practiceState.showAnswer ? 'bg-gray-600 hover:bg-gray-700' : 'bg-red-800 hover:bg-red-700') + '">' + (practiceState.showAnswer ? '隐藏答案' : '查看答案') + '</button>' +
                    '<button onclick="practiceMarkWrong()" class="py-3 rounded-lg font-bold bg-white border border-red-200 text-red-800 shadow-sm hover:bg-red-50 transition">答错，加入错题</button>' +
                    '<button onclick="nextPracticeQuestion()" class="py-3 rounded-lg font-bold bg-white border border-gray-200 text-gray-700 shadow-sm hover:bg-gray-50 transition">下一题 →</button>' +
                '</div>' +
            '</div>';
            updateMistakeButtons(q.id);
        }

        window.togglePracticeAnswer = function() {
            practiceState.showAnswer = !practiceState.showAnswer;
            renderContent();
        };

        window.practiceMarkWrong = function() {
            const q = practiceState.questions[practiceState.currentIndex];
            addMistake(q.id, false);
            window.nextPracticeQuestion();
        };

        window.nextPracticeQuestion = function() {
            practiceState.answeredCount += 1;
            practiceState.currentIndex += 1;
            if (practiceState.currentIndex >= practiceState.questions.length) {
                const pool = practicePool(practiceState.scope);
                practiceState.questions = shuffleCopy(pool.length ? pool : practiceState.questions);
                practiceState.currentIndex = 0;
                practiceState.round += 1;
            }
            practiceState.showAnswer = false;
            renderContent();
        };

        window.resetPractice = function() {
            practiceState.status = 'setup';
            renderContent();
        };

        function ensureExamConfig() {
            const chapters = Object.keys(SUBJECTS[currentSubjectId].chapters);
            if (examState.subjectId !== currentSubjectId) {
                examState = blankExamState();
                examState.subjectId = currentSubjectId;
                examState.selectedChapters = chapters.slice();
                examState.questionCount = Math.min(10, Math.max(1, questionsForChapters(currentSubjectId, chapters).length));
            }
            if (examState.selectedChapters.length === 0) examState.selectedChapters = chapters.slice();
        }

        function selectedExamPool() {
            ensureExamConfig();
            return questionsForChapters(currentSubjectId, examState.selectedChapters);
        }

        function renderExamMode(container) {
            ensureExamConfig();
            if (examState.status === 'result') return renderExamResult(container);
            if (examState.status !== 'active') return renderExamSetup(container);
            renderExamCard(container);
        }

        function renderExamSetup(container) {
            const chapters = Object.keys(SUBJECTS[currentSubjectId].chapters);
            const poolCount = selectedExamPool().length;
            examState.questionCount = Math.min(Math.max(1, Number(examState.questionCount) || 10), Math.max(1, poolCount));
            let chapterHtml = '';
            chapters.forEach(function(chapterKey) {
                const checked = examState.selectedChapters.indexOf(chapterKey) !== -1;
                const count = SUBJECTS[currentSubjectId].chapters[chapterKey].length;
                chapterHtml += '<label class="range-option flex items-start gap-3 p-3 bg-white border ' + (checked ? 'border-red-200 bg-red-50/60' : 'border-gray-200') + ' rounded-lg cursor-pointer hover:border-red-300">' +
                    '<input type="checkbox" class="mt-1" ' + (checked ? 'checked' : '') + ' onchange="toggleExamChapter(' + jsArg(chapterKey) + ', this.checked)">' +
                    '<span class="min-w-0"><span class="block text-sm font-bold text-gray-800">' + escapeHtml(chapterKey) + '</span><span class="block text-xs text-gray-400 mt-1">' + count + ' 题</span></span>' +
                '</label>';
            });
            container.innerHTML = '<div class="max-w-4xl mx-auto">' +
                '<div class="text-center mb-8"><div class="text-6xl mb-4">📝</div><h2 class="text-2xl font-bold text-gray-800">模拟考试</h2><p class="text-gray-500 text-sm mt-2">选择考试章节和题目数量，系统随机组卷。</p></div>' +
                '<div class="bg-white border border-gray-100 rounded-xl shadow-sm p-5 mb-5">' +
                    '<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-4"><div><h3 class="font-bold text-gray-800">考试范围</h3><p class="text-xs text-gray-500 mt-1">已选 ' + examState.selectedChapters.length + ' 章 · 可抽 ' + poolCount + ' 题</p></div>' +
                    '<div class="flex gap-2"><button onclick="selectAllExamChapters()" class="text-xs bg-red-50 text-red-800 px-3 py-2 rounded font-bold">全选</button><button onclick="clearExamChapters()" class="text-xs bg-gray-100 text-gray-600 px-3 py-2 rounded font-bold">清空</button></div></div>' +
                    '<div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-80 overflow-y-auto pr-1">' + chapterHtml + '</div>' +
                '</div>' +
                '<div class="bg-white border border-gray-100 rounded-xl shadow-sm p-5">' +
                    '<label class="block text-sm font-bold text-gray-800 mb-2" for="exam-count-input">题目数量</label>' +
                    '<div class="flex flex-col md:flex-row gap-3 md:items-center"><input id="exam-count-input" type="number" min="1" max="' + Math.max(1, poolCount) + '" value="' + examState.questionCount + '" oninput="setExamCount(this.value)" class="w-full md:w-40 px-3 py-3 border border-gray-200 rounded-lg font-bold focus:outline-none focus:border-red-700">' +
                    '<div class="flex gap-2"><button onclick="setExamCountPreset(5)" class="px-3 py-2 rounded bg-gray-100 text-gray-700 text-sm font-bold">5题</button><button onclick="setExamCountPreset(10)" class="px-3 py-2 rounded bg-gray-100 text-gray-700 text-sm font-bold">10题</button><button onclick="setExamCountPreset(20)" class="px-3 py-2 rounded bg-gray-100 text-gray-700 text-sm font-bold">20题</button></div></div>' +
                    '<button onclick="startMockExam()" class="mt-5 w-full bg-gradient-to-r from-red-900 to-red-700 text-white py-4 rounded-lg font-bold hover:shadow-lg transition">开始模拟考试</button>' +
                '</div>' +
            '</div>';
        }

        window.toggleExamChapter = function(chapterKey, checked) {
            ensureExamConfig();
            const set = new Set(examState.selectedChapters);
            checked ? set.add(chapterKey) : set.delete(chapterKey);
            examState.selectedChapters = Array.from(set).filter(function(key) { return SUBJECTS[currentSubjectId].chapters[key]; });
            const poolCount = selectedExamPool().length;
            examState.questionCount = Math.min(Math.max(1, Number(examState.questionCount) || 10), Math.max(1, poolCount));
            renderContent();
        };

        window.selectAllExamChapters = function() {
            examState.selectedChapters = Object.keys(SUBJECTS[currentSubjectId].chapters);
            renderContent();
        };

        window.clearExamChapters = function() {
            examState.selectedChapters = [];
            renderContent();
        };

        window.setExamCount = function(value) {
            const poolCount = selectedExamPool().length;
            examState.questionCount = Math.min(Math.max(1, Number(value) || 1), Math.max(1, poolCount));
        };

        window.setExamCountPreset = function(value) {
            window.setExamCount(value);
            renderContent();
        };

        window.startMockExam = function() {
            const input = document.getElementById('exam-count-input');
            if (input) window.setExamCount(input.value);
            startExamFromConfig();
        };

        function startExamFromConfig() {
            const pool = selectedExamPool();
            if (examState.selectedChapters.length === 0) { alert('请至少选择一个考试章节。'); return; }
            if (pool.length === 0) { alert('所选章节没有题目。'); return; }
            const count = Math.min(Math.max(1, Number(examState.questionCount) || 10), pool.length);
            examState.status = 'active';
            examState.subjectId = currentSubjectId;
            examState.questions = shuffleCopy(pool).slice(0, count);
            examState.currentIndex = 0;
            examState.showAnswer = false;
            examState.score = 0;
            renderContent();
        }

        function renderExamCard(container) {
            const q = examState.questions[examState.currentIndex];
            const total = examState.questions.length;
            const progress = ((examState.currentIndex + 1) / total) * 100;
            container.innerHTML = '<div class="max-w-3xl mx-auto flex flex-col h-full">' +
                '<div class="flex justify-between items-center mb-4 shrink-0 gap-3">' +
                    '<div class="text-xs font-bold text-gray-500 tracking-wider">📝 模拟考试 <span class="ml-2 bg-gray-200 px-2 py-0.5 rounded text-gray-700">' + (examState.currentIndex + 1) + ' / ' + total + '</span><span class="ml-2 bg-red-50 text-red-800 px-2 py-0.5 rounded">得分 ' + examState.score + '</span></div>' +
                    '<div class="flex gap-2">' + renderMistakeButton(q.id) + '<button onclick="resetExam()" class="text-gray-400 hover:text-red-600 px-2 text-xl" title="退出">×</button></div>' +
                '</div>' +
                '<div class="w-full bg-gray-200 h-1.5 rounded-full mb-6 shrink-0 overflow-hidden"><div class="bg-red-800 h-1.5 rounded-full transition-all duration-300" style="width:' + progress + '%"></div></div>' +
                '<div class="flex-1 bg-white rounded-xl shadow-sm border border-gray-100 p-6 md:p-10 overflow-y-auto flex flex-col relative">' +
                    '<div class="mb-8"><div class="text-xs text-gray-400 mb-2">' + escapeHtml(q.chapterName) + '</div><h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-snug">' + escapeHtml(q.q) + '</h3></div>' +
                    '<div class="' + (examState.showAnswer ? 'block fade-enter' : 'hidden') + ' flex-1 border-t border-dashed border-gray-200 pt-6"><div class="text-gray-400 text-xs uppercase font-bold mb-2">Answer</div><div class="text-gray-700 leading-relaxed text-lg">' + answerHtml(q.a) + '</div></div>' +
                    '<div class="' + (!examState.showAnswer ? 'flex' : 'hidden') + ' flex-1 items-center justify-center text-gray-300 flex-col py-10"><span class="text-4xl mb-2">🙈</span><span class="text-sm">先作答，再查看答案并自评</span></div>' +
                '</div>' +
                '<div class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-3 shrink-0">' +
                    '<button onclick="toggleExamAnswerState()" class="py-3 rounded-lg font-bold text-white shadow-md transition ' + (examState.showAnswer ? 'bg-gray-600 hover:bg-gray-700' : 'bg-red-800 hover:bg-red-700') + '">' + (examState.showAnswer ? '隐藏答案' : '查看答案') + '</button>' +
                    '<button onclick="gradeExam(false)" ' + (!examState.showAnswer ? 'disabled' : '') + ' class="py-3 rounded-lg font-bold bg-white border border-red-200 text-red-800 shadow-sm hover:bg-red-50 disabled:opacity-50 disabled:cursor-not-allowed transition">答错，加入错题</button>' +
                    '<button onclick="gradeExam(true)" ' + (!examState.showAnswer ? 'disabled' : '') + ' class="py-3 rounded-lg font-bold bg-white border border-gray-200 text-gray-700 shadow-sm hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition">答对，下一题</button>' +
                '</div>' +
            '</div>';
            updateMistakeButtons(q.id);
        }

        window.toggleExamAnswerState = function() {
            examState.showAnswer = !examState.showAnswer;
            renderContent();
        };

        window.gradeExam = function(isCorrect) {
            const q = examState.questions[examState.currentIndex];
            if (isCorrect) examState.score += 1;
            else addMistake(q.id, false);
            if (examState.currentIndex < examState.questions.length - 1) {
                examState.currentIndex += 1;
                examState.showAnswer = false;
            } else {
                examState.status = 'result';
            }
            renderContent();
        };

        function renderExamResult(container) {
            const total = examState.questions.length;
            const percent = total ? Math.round((examState.score / total) * 100) : 0;
            container.innerHTML = '<div class="max-w-lg mx-auto h-full flex flex-col items-center justify-center text-center">' +
                '<div class="text-6xl mb-5">🎉</div>' +
                '<h2 class="text-2xl font-bold text-gray-800 mb-2">考试完成</h2>' +
                '<p class="text-sm text-gray-500 mb-6">' + SUBJECTS[currentSubjectId].name + ' · ' + examState.questions.length + ' 题</p>' +
                '<div class="text-6xl font-black text-red-800 mb-2">' + examState.score + '<span class="text-2xl text-gray-400 font-normal">/' + total + '</span></div>' +
                '<div class="text-gray-600 mb-8">正确率 ' + percent + '%</div>' +
                '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full">' +
                    '<button onclick="startExamFromConfig()" class="bg-red-800 text-white px-6 py-3 rounded-lg shadow hover:bg-red-700 font-bold">按当前范围再考</button>' +
                    '<button onclick="resetExam()" class="bg-white text-gray-700 border border-gray-200 px-6 py-3 rounded-lg shadow-sm hover:bg-gray-50 font-bold">返回设置</button>' +
                '</div>' +
            '</div>';
        }

        window.resetExam = function() {
            examState.status = 'setup';
            examState.questions = [];
            examState.currentIndex = 0;
            examState.showAnswer = false;
            examState.score = 0;
            renderContent();
        };

        function init() {
            loadMistakes();
            renderSidebar();
            updateModeButtons();
            renderContent();
        }

        init();
    </script>
</body>
</html>

<body class="dsa-page" data-dsa-view="catalog">
  <header id="header" class="dsa-header">
    <a class="dsa-brand" href="../">Kotori's CS Learning</a>
    <a class="dsa-back-link" href="../">← 返回课程目录</a>

  <main class="dsa-shell">
    <aside class="dsa-sidebar" data-dsa-sidebar>

      <nav id="course-outline" class="dsa-course-outline" aria-label="数算课程目录" data-course-outline></nav>

    <section class="dsa-main" aria-labelledby="dsa-title">

        <div class="dsa-filter-group" role="group" aria-label="难度筛选">
          <button type="button" class="is-active" data-level-filter="all">全部</button>
          <button type="button" data-level-filter="基础">基础</button>
          <button type="button" data-level-filter="巩固">巩固</button>
          <button type="button" data-level-filter="提升">提升</button>
